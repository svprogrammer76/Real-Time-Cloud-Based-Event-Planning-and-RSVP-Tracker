<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gather | Event RSVP</title><link rel="stylesheet" href="/style.css"></head>
<body><header><b>gather<span>.</span></b><small id="who"></small></header><main>
<section id="auth" class="hero"><div><label>MAKE ROOM FOR WHAT MATTERS</label><h1>Bring people<br>together.</h1><p>Plan the moment. See every RSVP arrive.</p></div><form id="login"><h2 id="form-title">Welcome back</h2><input name="name" placeholder="Name" hidden><input name="email" placeholder="Email" type="email" required><input name="password" placeholder="Password (10+ characters)" type="password" required><select name="role" hidden><option>ATTENDEE</option><option>ORGANIZER</option></select><button id="submit">Sign in</button><button type="button" id="toggle" class="link">Create account</button></form></section>
<div id="app" hidden><section class="banner"><div><label>YOUR PEOPLE, IN ONE PLACE</label><h1>Good things happen<br>when we gather.</h1></div><button id="logout" class="light">Log out</button></section>
<section id="host" class="hero" hidden><div><label>HOST SOMETHING</label><h2>Create an event</h2><form id="event-form"><input name="name" placeholder="Event name" required><select name="event_type"><option>OTHER</option><option>WORKSHOP</option><option>CONFERENCE</option><option>WEBINAR</option><option>MEETUP</option><option>COMMUNITY</option></select><textarea name="description" placeholder="Description"></textarea><input name="date" type="date" required><input name="time" type="time" required><input name="end_time" type="time"><input name="venue" placeholder="Venue" required><input name="online_link" placeholder="Online meeting URL (optional)"><input name="capacity" type="number" min="1" value="30" required><label>RSVP deadline</label><input name="deadline" type="datetime-local" required><button>Publish event</button></form></div><div><label>LIVE COUNTS · REFRESH EVERY 2 SECONDS</label><div id="metrics" class="counts"></div><h3>Your in-app notifications</h3><div id="notifications"></div></div></section>
<section id="attendee" hidden><h2>My RSVPs</h2><div id="my-rsvps" class="cards"></div><h3>Notifications</h3><div id="attendee-notifications"></div></section><label>OPEN INVITATIONS</label><h2>Find your next thing.</h2><div id="events" class="cards"></div></div></main><aside id="toast"></aside><script src="/app.js?v=2"></script></body></html>
